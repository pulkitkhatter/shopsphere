server:
  port: 8083
  shutdown: graceful

spring:
  application:
    name: order-service
  threads:
    virtual:
      enabled: true
  cloud:
    loadbalancer:
      cache:
        ttl: 5s
  data:
    mongodb:
      uri: ${MONGO_URI:mongodb://localhost:27017/shopsphere_orders}
      auto-index-creation: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        enable.idempotence: true            # broker de-duplicates producer retries
        request.timeout.ms: 5000             # must be <= delivery.timeout.ms or the producer refuses to start
        delivery.timeout.ms: 10000
        spring.json.add.type.headers: false

shopsphere:
  security:
    jwk-set-uri: ${AUTH_JWKS_URI:http://localhost:8081/.well-known/jwks.json}
    issuer: ${AUTH_ISSUER:http://localhost:8081}
  topics:
    order-events: order-events
  outbox:
    poll-interval-ms: 1000

eureka:
  client:
    registry-fetch-interval-seconds: 5
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,circuitbreakers
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true

logging:
  pattern:
    level: "%5p [%X{correlationId:-}]"
