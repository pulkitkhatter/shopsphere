# Infrastructure only (MongoDB, Kafka, Redis). The Spring services run on the host via scripts/start-all.sh
services:
  mongo:
    image: mongo:7
    container_name: shopsphere-mongo
    ports: ["27017:27017"]
    volumes: [mongo-data:/data/db]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10

  kafka:
    image: apache/kafka:3.8.0   # single-node KRaft broker (no ZooKeeper)
    container_name: shopsphere-kafka
    ports: ["9092:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1     # single broker: internal topics cannot have 3 replicas
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3                     # auto-created topics get 3 partitions (consumers can scale to 3 instances)
    volumes: [kafka-data:/var/lib/kafka/data]

  redis:
    image: redis:7-alpine
    container_name: shopsphere-redis
    ports: ["6379:6379"]

volumes:
  mongo-data:
  kafka-data:
