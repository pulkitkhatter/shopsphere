openapi: 3.0.1
info:
  title: ShopSphere Product API
  description: Catalogue API. v1 is deprecated (sunset announced via the Sunset header);
    use v2.
  version: "2"
servers:
- url: http://localhost:8082
  description: Generated server url
paths:
  /api/v2/products/{id}:
    get:
      tags:
      - Products v2
      summary: Get one product (cached)
      operationId: get
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ProductV2"
    put:
      tags:
      - Products v2
      summary: Replace product (ADMIN)
      operationId: update
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductRequestV2"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ProductV2"
      security:
      - bearer-jwt: []
    delete:
      tags:
      - Products v2
      summary: Delete product (ADMIN)
      operationId: delete
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        "204":
          description: No Content
      security:
      - bearer-jwt: []
  /api/v2/products:
    get:
      tags:
      - Products v2
      summary: "Search products with filters, sorting and pagination"
      description: "q = full-text (whole words) over name/description. sort = field,direction\
        \ e.g. price,asc."
      operationId: search
      parameters:
      - name: q
        in: query
        required: false
        schema:
          type: string
      - name: category
        in: query
        required: false
        schema:
          type: string
      - name: minPrice
        in: query
        required: false
        schema:
          minimum: 0
          type: number
      - name: maxPrice
        in: query
        required: false
        schema:
          minimum: 0
          type: number
      - name: inStock
        in: query
        required: false
        schema:
          type: boolean
          default: false
      - name: page
        in: query
        required: false
        schema:
          minimum: 0
          type: integer
          format: int32
          default: 0
      - name: size
        in: query
        required: false
        schema:
          maximum: 100
          minimum: 1
          type: integer
          format: int32
          default: 12
      - name: sort
        in: query
        required: false
        schema:
          type: string
          default: "name,asc"
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PageResponseProductV2"
    post:
      tags:
      - Products v2
      summary: Create product (ADMIN)
      operationId: create
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductRequestV2"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ProductV2"
      security:
      - bearer-jwt: []
components:
  schemas:
    ProductRequestV2:
      required:
      - category
      - name
      - price
      - sku
      type: object
      properties:
        sku:
          maxLength: 40
          minLength: 0
          pattern: "[A-Za-z0-9-]+"
          type: string
        name:
          maxLength: 120
          minLength: 0
          type: string
        description:
          maxLength: 2000
          minLength: 0
          type: string
        category:
          maxLength: 60
          minLength: 0
          type: string
        price:
          minimum: 0.01
          exclusiveMinimum: false
          type: number
        stock:
          minimum: 0
          type: integer
          format: int32
        tags:
          maxItems: 10
          minItems: 0
          type: array
          items:
            type: string
    Price:
      type: object
      properties:
        amount:
          type: number
        currency:
          type: string
    ProductV2:
      type: object
      properties:
        id:
          type: string
        sku:
          type: string
        name:
          type: string
        description:
          type: string
        category:
          type: string
        price:
          $ref: "#/components/schemas/Price"
        stock:
          type: integer
          format: int32
        inStock:
          type: boolean
        tags:
          type: array
          items:
            type: string
        version:
          type: integer
          format: int64
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    PageResponseProductV2:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: "#/components/schemas/ProductV2"
        page:
          type: integer
          format: int32
        size:
          type: integer
          format: int32
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
          format: int32
  securitySchemes:
    bearer-jwt:
      type: http
      scheme: bearer
      bearerFormat: JWT
