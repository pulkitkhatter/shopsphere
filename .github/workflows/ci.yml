name: CI
on:
  push: { branches: [main] }
  pull_request:

jobs:
  maven:
    name: Maven services (unit + Testcontainers integration tests + REST Docs)
    runs-on: ubuntu-latest          # has Docker, which the *IT classes (Testcontainers) need
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21, cache: maven }
      - run: ./mvnw -B verify
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jacoco-reports
          path: "**/target/site/jacoco/"

  gradle:
    name: notification-service (Gradle)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21, cache: gradle }
      - run: ./gradlew --no-daemon test jacocoTestReport
        working-directory: notification-service

  frontend:
    name: Web app (npm)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm test
        working-directory: frontend
